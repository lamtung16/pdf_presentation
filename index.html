<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Offline PDF Viewer</title>
<style>
html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    background: #333;
}
#container {
    position: relative;
    width: 100%;
    height: 100%;
}
canvas {
    position: absolute;
    top: 0;
    left: 0;
}
#textLayer {
    position: absolute;
    top: 0;
    left: 0;
    z-index: 3;
    pointer-events: none;
}
#cursorDot {
    position: fixed;
    width: 20px;
    height: 20px;
    background: red;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9999;
    transform: translate(-50%, -50%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 14px;
    font-weight: bold;
}
#controls {
    position: fixed;
    top: 10px;
    left: 10px;
    z-index: 10000;
    background: rgba(255,255,255,0.9);
    padding: 5px 10px;
    border-radius: 4px;
}
</style>
</head>
<body>
<div id="controls">
    <input type="file" id="fileInput" accept="application/pdf">
    <button id="fullscreenBtn">Full Screen</button>
</div>

<div id="container">
    <canvas id="pdfCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
    <div id="textLayer"></div>
</div>

<div id="cursorDot"></div>

<script src="pdf.js"></script>
<script src="app.js"></script>
</body>
</html>
